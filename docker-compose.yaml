services:

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/cv_analyzer.db
      DATA_DIR: /app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Loopback only — host nginx reverse-proxies /api/ to this port. Never
    # publish on 0.0.0.0; nginx is what gates access (Basic Auth, TLS).
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data

volumes:
  backend-data:
